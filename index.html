<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeaveFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F4F7;--card:#fff;--ink:#17202B;--mute:#5F6B7A;--line:#DDE2E8;--brand:#24527A;--brand-ink:#fff;--ok:#1F7A4D;--okbg:#E2F3EA;--no:#B3261E;--nobg:#FBE6E4;--wait:#8A5A00;--waitbg:#FFF1D1;--off:#59636F;--offbg:#E8EBEF}
@media(prefers-color-scheme:dark){:root{--bg:#10161D;--card:#18212B;--ink:#E8EDF3;--mute:#9AA6B4;--line:#2A3644;--brand:#6FA8DC;--brand-ink:#0C1218;--ok:#6FD3A0;--okbg:#14301F;--no:#FF8F86;--nobg:#3A1A18;--wait:#F2C46B;--waitbg:#35290D;--off:#A9B3BF;--offbg:#242F3B}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "Public Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.hide{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth-box{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:28px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.02em}
h2{font-size:20px;margin:0 0 16px}
.sub{color:var(--mute);margin:0 0 20px}
.tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:8px 12px;cursor:pointer;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--brand);font-weight:600}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:6px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ok{background:var(--ok);color:var(--card)}
.btn.no{background:var(--no);color:var(--card)}
.auth-box .btn{width:100%;margin-top:18px}
.msg{margin-top:12px;font-size:13px;color:var(--no)}
.warn{background:var(--waitbg);color:var(--wait);padding:10px 12px;border-radius:6px;font-size:13px;margin-bottom:16px}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:2px}
aside .logo{font-weight:700;font-size:18px;padding:0 10px 16px}
aside .who{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);font-size:13px;color:var(--mute)}
aside .who b{display:block;color:var(--ink)}
.nav{background:none;border:0;text-align:left;padding:9px 10px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.nav:hover{background:var(--bg)}.nav.on{background:var(--bg);font-weight:600}
.badge{background:var(--no);color:var(--card);border-radius:10px;font-size:11px;padding:1px 7px;font-weight:700}
main{padding:28px;max-width:980px;width:100%}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}
.stat .n{font-size:28px;font-weight:700;line-height:1.1}.stat .l{color:var(--mute);font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:20px}
.panel.narrow{max-width:520px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--mute);font-weight:600}
tr:last-child td{border-bottom:0}
.pill{padding:2px 9px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap}
.pending{background:var(--waitbg);color:var(--wait)}.approved{background:var(--okbg);color:var(--ok)}
.rejected{background:var(--nobg);color:var(--no)}.cancelled{background:var(--offbg);color:var(--off)}
.empty{color:var(--mute);padding:8px 0}
.acts{display:flex;gap:6px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:14px}
@media(max-width:720px){.shell{grid-template-columns:1fr}aside{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);padding:10px}aside .logo{width:100%;padding-bottom:6px}aside .who{margin:0;border:0;width:100%}main{padding:16px}.row{grid-template-columns:1fr}}
</style>
</head>
<body>

<section id="auth" class="auth hide">
  <div class="auth-box">
    <h1>LeaveFlow</h1>
    <p class="sub">Apply for leave. Get approvals fast.</p>
    <div id="cfgwarn" class="warn hide">Firebase isn’t configured yet. Paste your config into the <code>firebaseConfig</code> block in index.html.</div>
    <div class="tabs"><button id="t-in" class="on" type="button">Sign in</button><button id="t-up" type="button">Create account</button></div>
    <div id="f-name-w" class="hide"><label for="f-name">Full name</label><input id="f-name" autocomplete="name"></div>
    <label for="f-email">Email</label><input id="f-email" type="email" autocomplete="email">
    <label for="f-pass">Password</label><input id="f-pass" type="password" autocomplete="current-password" placeholder="At least 6 characters">
    <div id="f-role-w" class="hide"><label for="f-role">Role</label>
      <select id="f-role"><option value="employee">Employee</option><option value="manager">Manager</option></select></div>
    <button id="f-go" class="btn" type="button">Sign in</button>
    <div id="f-msg" class="msg" role="alert"></div>
  </div>
</section>

<div id="app" class="shell hide">
  <aside id="side"></aside>
  <main id="main"></main>
</div>
<div id="loading" class="auth">Loading…</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,addDoc,collection,query,where,onSnapshot,increment} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ===== 1. PASTE YOUR FIREBASE CONFIG HERE (Project settings > Your apps > Web) =====
const firebaseConfig = {
  apiKey: "AIzaSyCz_c4_nBmFCxSBdmebLeJWSxrwjgMr3nw",
  authDomain: "leaveflow-prod-b23c4.firebaseapp.com",
  databaseURL: "https://leaveflow-prod-b23c4-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "leaveflow-prod-b23c4",
  storageBucket: "leaveflow-prod-b23c4.firebasestorage.app",
  messagingSenderId: "430317111824",
  appId: "1:430317111824:web:19b7106e956709beb6d895"
};

// ==================================================================================

const TYPES = {annual:"Annual",sick:"Sick",casual:"Casual"};
const START = {annual:20,sick:10,casual:7};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = d => new Date(d+"T00:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
const pill = s => `<span class="pill ${s}">${s[0].toUpperCase()+s.slice(1)}</span>`;
const show = id => { ["auth","app","loading"].forEach(x=>$("#"+x).classList.toggle("hide",x!==id)); };
const toast = t => { const e=document.createElement("div"); e.className="toast"; e.textContent=t; document.body.append(e); setTimeout(()=>e.remove(),2600); };

if (firebaseConfig.apiKey.startsWith("YOUR")) { $("#cfgwarn").classList.remove("hide"); show("auth"); }
const fb = firebaseConfig.apiKey.startsWith("YOUR") ? null : initializeApp(firebaseConfig);
const auth = fb && getAuth(fb), db = fb && getFirestore(fb);

let me = null, leaves = [], view = "dash", unsub = null, signingUp = false, mode = "in";

/* ---------- Auth screen ---------- */
function setMode(m){
  mode=m;
  $("#t-in").classList.toggle("on",m==="in"); $("#t-up").classList.toggle("on",m==="up");
  ["f-name-w","f-role-w"].forEach(i=>$("#"+i).classList.toggle("hide",m==="in"));
  $("#f-go").textContent = m==="in" ? "Sign in" : "Create account";
  $("#f-pass").autocomplete = m==="in" ? "current-password" : "new-password";
  $("#f-msg").textContent="";
}
$("#t-in").onclick=()=>setMode("in"); $("#t-up").onclick=()=>setMode("up");
["f-email","f-pass","f-name"].forEach(i=>$("#"+i).addEventListener("keydown",e=>{if(e.key==="Enter")$("#f-go").click()}));

$("#f-go").onclick = async () => {
  if(!auth) return;
  const email=$("#f-email").value.trim(), pass=$("#f-pass").value, msg=$("#f-msg"), btn=$("#f-go");
  msg.textContent="";
  if(!email||!pass){ msg.textContent="Enter your email and password."; return; }
  btn.disabled=true;
  try{
    if(mode==="in"){ await signInWithEmailAndPassword(auth,email,pass); }
    else{
      const name=$("#f-name").value.trim();
      if(!name){ msg.textContent="Enter your full name."; btn.disabled=false; return; }
      signingUp=true;  // stops onAuthStateChanged from reading the profile before it exists
      const cred=await createUserWithEmailAndPassword(auth,email,pass);
      await setDoc(doc(db,"users",cred.user.uid),{name,email,role:$("#f-role").value,balances:{...START},createdAt:Date.now()});
      signingUp=false;
      await boot(cred.user);
    }
  }catch(e){ signingUp=false; msg.textContent=friendly(e); }
  btn.disabled=false;
};
function friendly(e){
  const m={"auth/invalid-credential":"Wrong email or password.","auth/email-already-in-use":"That email already has an account. Sign in instead.","auth/weak-password":"Use a password with at least 6 characters.","auth/invalid-email":"Enter a valid email address.","auth/operation-not-allowed":"Enable Email/Password sign-in in the Firebase console.","permission-denied":"Firestore rules blocked this. Publish firestore.rules."};
  return m[e.code]||e.message;
}

/* ---------- Session ---------- */
if(auth) onAuthStateChanged(auth, async u => {
  if(signingUp) return;
  if(!u){ if(unsub)unsub(); me=null; show("auth"); return; }
  await boot(u);
});

async function boot(u){
  let snap=null;
  for(let i=0;i<5;i++){ snap=await getDoc(doc(db,"users",u.uid)); if(snap.exists())break; await new Promise(r=>setTimeout(r,500)); }
  if(!snap||!snap.exists()){ await signOut(auth); $("#f-msg").textContent="Profile not found. Create your account again."; show("auth"); return; }
  me={uid:u.uid,...snap.data()};
  view="dash"; show("app"); listen();
}

// Single-field queries only, so no composite indexes are needed. Sorting happens in the browser.
function listen(){
  if(unsub)unsub();
  const q = me.role==="manager" ? collection(db,"leaves") : query(collection(db,"leaves"),where("uid","==",me.uid));
  unsub=onSnapshot(q,async s=>{
    leaves=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.createdAt-a.createdAt);
    const fresh=await getDoc(doc(db,"users",me.uid)); if(fresh.exists()) me={uid:me.uid,...fresh.data()};
    render();
  },e=>toast(friendly(e)));
}

/* ---------- Views ---------- */
const mgr = () => me.role==="manager";
const pendingCount = () => leaves.filter(l=>l.status==="pending").length;

function render(){
  const nav=[["dash","Dashboard"],["apply","Apply for leave"],["mine","My leaves"]];
  if(mgr()) nav.push(["req","Requests",pendingCount()],["cal","Team calendar"]);
  $("#side").innerHTML=`<div class="logo">LeaveFlow</div>`+nav.map(([k,l,n])=>
    `<button class="nav ${view===k?"on":""}" data-view="${k}">${l}${n?`<span class="badge">${n}</span>`:""}</button>`).join("")+
    `<div class="who"><b>${esc(me.name)}</b>${mgr()?"Manager":"Employee"}<br><button class="btn ghost sm" id="out" style="margin-top:8px">Sign out</button></div>`;
  $("#main").innerHTML=({dash,apply,mine,req,cal})[view]();
  if(view==="apply") bindApply();
}

function dash(){
  const mine=leaves.filter(l=>l.uid===me.uid);
  const bal=Object.keys(TYPES).map(k=>`<div class="stat"><div class="n">${me.balances?.[k]??0}</div><div class="l">${TYPES[k]} days left</div></div>`).join("");
  const mgrStats=mgr()?`<div class="stat"><div class="n">${pendingCount()}</div><div class="l">Requests waiting</div></div>`:"";
  return `<h2>Hello, ${esc(me.name.split(" ")[0])}</h2><div class="stats">${bal}${mgrStats}</div>
  <div class="panel"><b>Recent requests</b>${table(mine.slice(0,5),false)}</div>`;
}

function table(list,withActions){
  if(!list.length) return `<p class="empty">Nothing here yet.</p>`;
  return `<div class="tw"><table><thead><tr>${withActions?"<th>Employee</th>":""}<th>Type</th><th>Dates</th><th>Days</th><th>Reason</th><th>Status</th><th></th></tr></thead><tbody>`+
  list.map(l=>`<tr>${withActions?`<td>${esc(l.name)}</td>`:""}<td>${TYPES[l.type]}</td><td>${fmt(l.from)} to ${fmt(l.to)}</td><td>${l.days}</td><td>${esc(l.reason)}</td><td>${pill(l.status)}</td>
  <td><div class="acts">${
    withActions&&l.status==="pending" ? `<button class="btn ok sm" data-act="approved" data-id="${l.id}">Approve</button><button class="btn no sm" data-act="rejected" data-id="${l.id}">Reject</button>`
    : !withActions&&l.status==="pending" ? `<button class="btn ghost sm" data-cancel="${l.id}">Cancel</button>` : ""}</div></td></tr>`).join("")+`</tbody></table></div>`;
}

function apply(){
  const today=new Date().toISOString().slice(0,10);
  return `<h2>Apply for leave</h2><div class="panel narrow">
  <label for="a-type">Leave type</label><select id="a-type">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v} (${me.balances?.[k]??0} left)</option>`).join("")}</select>
  <div class="row"><div><label for="a-from">From</label><input id="a-from" type="date" min="${today}"></div><div><label for="a-to">To</label><input id="a-to" type="date" min="${today}"></div></div>
  <label for="a-reason">Reason</label><textarea id="a-reason" rows="3"></textarea>
  <button class="btn" id="a-go" style="margin-top:16px">Submit request</button><div class="msg" id="a-msg" role="alert"></div></div>`;
}
const mine = () => `<h2>My leaves</h2><div class="panel">${table(leaves.filter(l=>l.uid===me.uid),false)}</div>`;
const req = () => `<h2>Requests</h2><div class="panel">${table(leaves,true)}</div>`;
function cal(){
  const ok=leaves.filter(l=>l.status==="approved").sort((a,b)=>a.from.localeCompare(b.from));
  return `<h2>Team calendar</h2><div class="panel">${ok.length?`<div class="tw"><table><thead><tr><th>Employee</th><th>Type</th><th>From</th><th>To</th><th>Days</th></tr></thead><tbody>`+
  ok.map(l=>`<tr><td>${esc(l.name)}</td><td>${TYPES[l.type]}</td><td>${fmt(l.from)}</td><td>${fmt(l.to)}</td><td>${l.days}</td></tr>`).join("")+`</tbody></table></div>`:`<p class="empty">No approved leave yet.</p>`}</div>`;
}

/* ---------- Actions ---------- */
function bindApply(){
  $("#a-go").onclick=async()=>{
    const type=$("#a-type").value,from=$("#a-from").value,to=$("#a-to").value,reason=$("#a-reason").value.trim(),msg=$("#a-msg");
    if(!from||!to||!reason){msg.textContent="Fill in the dates and a reason.";return;}
    const days=Math.round((new Date(to)-new Date(from))/864e5)+1;
    if(days<1){msg.textContent="The end date must be on or after the start date.";return;}
    if(days>(me.balances?.[type]??0)){msg.textContent=`You only have ${me.balances?.[type]??0} ${TYPES[type].toLowerCase()} days left.`;return;}
    $("#a-go").disabled=true;
    try{
      await addDoc(collection(db,"leaves"),{uid:me.uid,name:me.name,type,from,to,days,reason,status:"pending",createdAt:Date.now()});
      toast("Request submitted"); view="mine"; render();
    }catch(e){msg.textContent=friendly(e);$("#a-go").disabled=false;}
  };
}

document.addEventListener("click",async e=>{
  const t=e.target.closest("button"); if(!t||!me)return;
  if(t.dataset.view){view=t.dataset.view;render();}
  else if(t.id==="out"){signOut(auth);}
  else if(t.dataset.cancel){
    try{await updateDoc(doc(db,"leaves",t.dataset.cancel),{status:"cancelled"});toast("Request cancelled");}catch(x){toast(friendly(x));}
  }
  else if(t.dataset.act){
    const l=leaves.find(x=>x.id===t.dataset.id); if(!l)return;
    t.disabled=true;
    try{
      await updateDoc(doc(db,"leaves",l.id),{status:t.dataset.act,reviewedBy:me.name,reviewedAt:Date.now()});
      if(t.dataset.act==="approved") await updateDoc(doc(db,"users",l.uid),{[`balances.${l.type}`]:increment(-l.days)});
      toast(t.dataset.act==="approved"?"Request approved":"Request rejected");
    }catch(x){toast(friendly(x));t.disabled=false;}
  }
});

setMode("in");
if(!auth) show("auth");
</script>
</body>
</html>
